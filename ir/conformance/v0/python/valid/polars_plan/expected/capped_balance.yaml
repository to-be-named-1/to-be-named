# The document that capped_balance:capped_balance produces.
ir_version: 0
kind: node_type
name: capped_balance
version: 1
title: Running balance with a cap
tags:
- running_total
- finance
language: python
plan: polars
image: platform-base
entry_point: capped_balance:capped_balance
modes:
- batch
inputs:
  movements:
    type: tabular
outputs:
  balances:
    type: tabular
    schema: derived
params:
  amount:
    type: string
    format: column
    of: movements
  time:
    type: string
    format: column
    of: movements
  cap:
    type: number
  group_by:
    type: array
    format: column_selector
    of: movements
    default: []
grouping:
  parameter: group_by
order:
  parameter: time
