[project]
name = "ir"
version = "0.0.0"
description = "The IR schema, one JSON Schema document per kind for each IR version."
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"units".msg = "ir never imports units: it is a contract the others depend on."
"sdk".msg = "ir never imports sdk: it is a contract the others depend on."
"nodes".msg = "ir never imports nodes: it is a contract the others depend on."
"connectors".msg = "ir never imports connectors: it is a contract the others depend on."
"families".msg = "ir never imports families: it is a contract the others depend on."

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
