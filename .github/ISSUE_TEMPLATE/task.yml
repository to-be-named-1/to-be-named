name: Task
description: One to three days of work with one owner.
type: Task
projects: ["to-be-named-1/1"]
body:
  - type: textarea
    id: work
    attributes:
      label: Work
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The test or check that shows it is done.
    validations:
      required: true
  - type: checkboxes
    id: design
    attributes:
      label: Design
      options:
        - label: Every design choice this work needs is recorded in `docs/architecture/`, or a Design issue for it blocks this issue.
          required: true
