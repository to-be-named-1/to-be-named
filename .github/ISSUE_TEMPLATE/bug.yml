name: Bug
description: Something does not work as recorded or specified.
type: Bug
projects: ["to-be-named-1/1"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: Point to the documentation or specification that says so, if one does.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit or version where it happens.
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      render: shell
