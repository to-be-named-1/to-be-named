name: go

# Runs on every push and pull request, so that the required check always reports; the check job itself runs
# only when files it covers changed (tools/ci/changed.sh).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: go-changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "run=$(sh tools/ci/changed.sh '^(go\.mod|go\.sum|.*\.go|\.golangci\.yml|docker-compose\.yml|Makefile|\.github/workflows/go\.yml|tools/ci/.*)$')" >> "$GITHUB_OUTPUT"

  check:
    name: go-check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain line in go.mod fixes the exact Go version.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check
        run: make go-check
