name: web

# Runs on every push and pull request, so that the required check always reports; the check job itself runs
# only when files it covers changed (tools/ci/changed.sh).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: web-changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "run=$(sh tools/ci/changed.sh '^(webapp/.*|Makefile|\.github/workflows/web\.yml|tools/ci/.*)$')" >> "$GITHUB_OUTPUT"

  check:
    name: web-check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The packageManager field in webapp/package.json fixes pnpm's version, and webapp/.nvmrc Node's.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webapp/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: webapp/.nvmrc
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Check
        run: make web-check
