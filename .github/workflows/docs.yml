name: docs

# Runs on every push and pull request, so that the required check always reports; the check job itself runs
# only when files it covers changed (tools/ci/changed.sh).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: architecture-changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "run=$(sh tools/ci/changed.sh '^(docs/.*|tools/docs/.*|docker-compose\.yml|Makefile|\.github/workflows/docs\.yml|tools/ci/.*)$')" >> "$GITHUB_OUTPUT"

  architecture:
    name: architecture-check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Gate: validate, the ADR checks, traceability and forbidden relationships.
      - name: Check
        run: make docs-check

      # Report-only until the model is complete (the target ignores its exit status).
      - name: Inspect
        run: make docs-inspect

      - name: Export
        run: make docs-export

      - name: Upload the static site
        uses: actions/upload-artifact@v7
        with:
          name: architecture-site
          path: docs/build/site
