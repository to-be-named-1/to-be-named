name: python

# Runs on every pull request, so that the required check always reports; the check job itself runs only
# when files it covers changed since the pull request's base (tools/ci/changed.sh). There is no push trigger:
# a second run on the same commit would report a check of the same name, compared with a different base.
on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: python-changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: echo "run=$(sh tools/ci/changed.sh '^(pyproject\.toml|uv\.lock|\.python-version|units/.*|sdk/.*|Makefile|\.github/workflows/python\.yml|tools/ci/.*)$')" >> "$GITHUB_OUTPUT"

  check:
    name: python-check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv.lock fixes the tools' versions and .python-version the interpreter.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"

      - name: Check
        run: make py-check
