name: python

on:
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "units/**"
      - "sdk/**"
      - "Makefile"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "units/**"
      - "sdk/**"
      - "Makefile"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv.lock fixes the tools' versions and .python-version the interpreter.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"

      - name: Check
        run: make py-check
