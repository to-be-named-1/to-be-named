name: python

# Runs on every push and pull request, so that the required check always reports; the check job itself runs
# only when files it covers changed (tools/ci/changed.sh).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: python-changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "run=$(sh tools/ci/changed.sh '^(pyproject\.toml|uv\.lock|\.python-version|units/.*|sdk/.*|Makefile|\.github/workflows/python\.yml|tools/ci/.*)$')" >> "$GITHUB_OUTPUT"

  check:
    name: python-check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv.lock fixes the tools' versions and .python-version the interpreter.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"

      - name: Check
        run: make py-check
