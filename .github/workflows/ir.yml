name: ir

# Runs on every push and pull request, so that the required check always reports; the check job itself runs
# only when files it covers changed (tools/ci/changed.sh).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: ir-schema-changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "run=$(sh tools/ci/changed.sh '^(controlplane/internal/authoring/ir/.*|tools/ir/.*|docker-compose\.yml|Makefile|\.github/workflows/ir\.yml|tools/ci/.*)$')" >> "$GITHUB_OUTPUT"

  schema:
    name: ir-schema-check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gate: every schema compiles, every valid document passes, every schema-invalid document fails.
      - name: Check
        run: make ir-check
