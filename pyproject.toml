# uv workspace for the Python containers: the unit runtime, the SDK, the platform's plugins, the IR schema and the
# reader of node code, with one lockfile.
[tool.uv.workspace]
members = ["units", "sdk", "nodes", "connectors", "families", "ir/schema", "ir/reader"]

[dependency-groups]
# The sdk's extras let pyright check the code that refers to Ibis and Polars; PyYAML reads the conformance corpus.
dev = [
    "packaging==26.3",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.2",
    "sdk[ibis,polars]",
]

[tool.uv.sources]
sdk = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 120
include = [
    "units/**/*.py", "sdk/**/*.py", "nodes/**/*.py", "connectors/**/*.py", "families/**/*.py", "ir/**/*.py",
    "tools/python/**/*.py",
]
# The conformance corpus holds node code that is wrong on purpose.
extend-exclude = ["ir/conformance"]

# Each member's own pyproject.toml extends this one and lists the packages it must not import. Ruff uses only
# the closest configuration, so a member's [tool.ruff] without `extend` would silently drop these rules.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID251"]

[tool.pyright]
pythonVersion = "3.14"
include = [
    "units/src", "units/tests",
    "sdk/src", "sdk/tests",
    "nodes/src", "nodes/tests",
    "connectors/src", "connectors/tests",
    "families/src", "families/tests",
    "ir/schema/src", "ir/schema/tests",
    "ir/reader/src", "ir/reader/tests",
    "tools/python",
]

[tool.pytest.ini_options]
testpaths = ["units/tests", "sdk/tests", "nodes/tests", "connectors/tests", "families/tests", "ir/schema/tests", "ir/reader/tests", "tools/python"]
