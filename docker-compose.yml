services:
  structurizr:
    image: structurizr/structurizr:2026.09.19
    command: local
    # The image's own user (65532) by default; the Makefile passes the host user's IDs, so that on a Linux host
    # Structurizr can write its data directory (docs/architecture) and docs/build.
    user: "${DOCS_UID:-65532}:${DOCS_GID:-65532}"
    profiles: [docs]
    ports:
      - "${STRUCTURIZR_PORT:-8080}:8080"
    environment:
      STRUCTURIZR_WORKSPACE_MAXSIZE: "4MB"
    volumes:
      # Writable: `local` writes workspace.json beside workspace.dsl (gitignored).
      - ./docs/architecture:/usr/local/structurizr
      # Export output (gitignored).
      - ./docs/build:/usr/local/build

  # make ir-check: the IR schema and its conformance corpus, checked with jv (tools/ir/check.sh).
  ir-check:
    image: golang:1.25.14
    profiles: [ir]
    working_dir: /src
    entrypoint: ["sh", "tools/ir/check.sh"]
    volumes:
      # Read-only: the check writes nothing into the repository.
      - ./:/src:ro
      # Go's module and build caches, so that jv is built once.
      - ir-go:/go
      - ir-go-build:/root/.cache/go-build

volumes:
  ir-go:
  ir-go-build:
